name: Publish to Cloudflare

# Push to master -> CI (ci.yml) -> scripts/deploy.sh uploads public/ to the
# Cloudflare Worker hackcoc -> scripts/smoke.sh against the live site. The
# Worker serves static files only, so master here is always what
# hackcodeofconduct.org serves.
#
# The Cloudflare token lives in the production environment alone, which only
# master can use, and only the Deploy step is given it, on a GitHub runner
# that's thrown away after the job. Actions are pinned by commit (their
# version in the comment).

on:
  push:
    branches: [master]
    # Only what wrangler uploads. A README change should not redeploy.
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/deploy.sh"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Serialised: two pushes in quick succession must not race to deploy.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A gate: Cloudflare only ever gets files that passed. pull-requests: read
  # is for ci.yml's merge job, which never runs here, but GitHub refuses a
  # called workflow that asks for more than it's given.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  deploy:
    needs: ci
    # A manual run can pick any branch; only master ever deploys.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy.sh

      - name: Smoke, live
        env:
          SMOKE_URL: https://hackcodeofconduct.org
        run: scripts/smoke.sh
