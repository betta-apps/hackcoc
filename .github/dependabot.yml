# deps-factory (betta-apps/deps-factory) owns version updates for wrangler;
# Dependabot keeps security updates (open-pull-requests-limit 0 turns off only
# version PRs) and refreshes the Actions pins monthly.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
